<title>Coaster Carnage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>:root {
  color-scheme: dark;
  --panel: rgba(14, 20, 44, 0.82);
  --panel2: rgba(24, 32, 66, 0.9);
  --line: rgba(255, 255, 255, 0.12);
  --text: #f4f1ff;
  --muted: #a9b2d6;
  --gold: #ffd23f;
  --gold2: #ff9f1c;
  --blue: #2f7cf6;
  --red: #f0413d;
  --green: #5cff8a;
  --pink: #ff5d8f;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --display: 'Lilita One', 'Arial Black', Impact, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: Nunito, system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--text); user-select: none; -webkit-user-select: none; }
#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
#ui * { pointer-events: auto; }
#ui .passthru, #ui .passthru * { pointer-events: none; }
button { font-family: inherit; }
.hidden { display: none !important; }

/* ── generic widgets ── */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.btn { cursor: pointer; border: none; border-radius: 14px; padding: 10px 18px; font-weight: 900; font-size: 15px; color: #1d1432; background: linear-gradient(#ffe066, #ffc21a); box-shadow: 0 4px 0 #c78400, 0 8px 18px rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s, filter .15s; letter-spacing: .3px; }
.btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c78400, 0 4px 10px rgba(0,0,0,.3); }
.btn.big { font-family: var(--display); font-size: 26px; padding: 14px 30px; border-radius: 18px; font-weight: 400; letter-spacing: 1px; }
.btn.blue { color: white; background: linear-gradient(#58a0ff, #2f7cf6); box-shadow: 0 4px 0 #1a4fa8, 0 8px 18px rgba(0,0,0,.35); }
.btn.red { color: white; background: linear-gradient(#ff7a73, #f0413d); box-shadow: 0 4px 0 #a3221f, 0 8px 18px rgba(0,0,0,.35); }
.btn.ghost { color: var(--text); background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ghost:hover { background: rgba(255,255,255,0.14); }
.btn.green { color: #0d2a16; background: linear-gradient(#8dffab, #3fe070); box-shadow: 0 4px 0 #1f9a45, 0 8px 18px rgba(0,0,0,.35); }
.btn:disabled { filter: grayscale(0.8) brightness(0.7); cursor: not-allowed; transform: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.08); font-weight: 800; font-size: 13px; }
.kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.14); border-bottom: 2px solid rgba(0,0,0,.4); font-size: 12px; font-weight: 800; text-align: center; }

/* ── title screen ── */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: radial-gradient(ellipse at center, rgba(10,14,40,0.15) 0%, rgba(8,10,28,0.72) 75%); }
.logo { text-align: center; filter: drop-shadow(0 12px 30px rgba(0,0,0,.6)); animation: bob 3.2s ease-in-out infinite; }
.logo h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(48px, 9vw, 118px); line-height: .95; letter-spacing: 2px; background: linear-gradient(#fff6c8 10%, #ffd23f 45%, #ff8a1c 85%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 3px #3a1d5c; paint-order: stroke fill; transform: rotate(-3deg); }
.logo h1 span { display: inline-block; }
.logo .sub { margin-top: 10px; font-family: var(--display); font-size: clamp(16px, 2.2vw, 26px); color: #fff; letter-spacing: 3px; text-shadow: 0 3px 0 #3a1d5c, 0 6px 16px rgba(0,0,0,.6); }
.logo .tag { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--pink), var(--red)); font-weight: 900; font-size: 13px; letter-spacing: 1px; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
.menu { display: flex; flex-direction: column; gap: 14px; width: min(360px, 86vw); }
.menu .btn { width: 100%; }
.menu .row .btn { width: auto; flex: 1; }
.credits { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.55); font-size: 12px; font-weight: 700; }

/* ── modal ── */
.modal-back { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6, 8, 22, 0.55); padding: 16px; }
.modal { width: min(980px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 24px; }
.modal h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 34px; letter-spacing: 1px; }
.modal h3 { margin: 18px 0 8px; font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .5px; color: var(--gold); }
.modal p { color: var(--muted); line-height: 1.5; margin: 6px 0; }
.rivals { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.rival { cursor: pointer; padding: 14px; border-radius: 16px; background: var(--panel2); border: 2px solid transparent; transition: transform .1s, border-color .15s; }
.rival:hover { transform: translateY(-2px); }
.rival.sel { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255,210,63,.18); }
.rival .av { font-size: 40px; line-height: 1; }
.rival .nm { font-family: var(--display); font-size: 20px; margin-top: 6px; }
.rival .tt { font-size: 12px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
.rival .bl { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.35; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { cursor: pointer; padding: 9px 14px; border-radius: 12px; border: 2px solid transparent; background: rgba(255,255,255,.07); color: var(--text); font-weight: 900; font-size: 14px; }
.seg button.sel { border-color: var(--gold); background: rgba(255,210,63,.14); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; margin-top: 20px; }
input.txt { background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 10px; color: var(--text); padding: 9px 12px; font: 800 15px Nunito, sans-serif; width: 260px; }
.help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.help-card { padding: 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 14px; line-height: 1.45; color: var(--muted); }
.help-card b { color: var(--text); }
.unit-ref { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.unit-ref div { font-size: 13px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.05); color: var(--muted); }
.unit-ref b { color: var(--text); }

/* ── HUD ── */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.topbar { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; flex-wrap: wrap; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.stats { display: flex; gap: 6px; padding: 8px; align-items: center; }
.stat { display: flex; flex-direction: column; padding: 4px 10px; min-width: 70px; }
.stat .v { font-family: var(--display); font-size: 22px; line-height: 1.05; letter-spacing: .5px; }
.stat .l { font-size: 11px; color: var(--muted); font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }
.stat.money .v { color: var(--green); }
.stat .inc { font-size: 11px; font-weight: 900; color: var(--green); }
.stars { color: var(--gold); font-size: 14px; letter-spacing: -1px; }
.center { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 14px; min-width: min(560px, 48vw); }
.phase { display: flex; align-items: center; gap: 10px; }
.phase .round { font-weight: 900; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
.phase .name { font-family: var(--display); font-size: 22px; letter-spacing: 1px; }
.phase .timer { font-family: var(--display); font-size: 22px; color: var(--gold); min-width: 56px; text-align: center; }
.castles { display: flex; width: 100%; gap: 10px; align-items: center; }
.cbar { flex: 1; }
.cbar .nm { font-size: 12px; font-weight: 900; display: flex; justify-content: space-between; margin-bottom: 3px; }
.cbar .track { height: 12px; border-radius: 99px; background: rgba(0,0,0,.45); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.cbar .fill { height: 100%; border-radius: 99px; transition: width .3s; }
.cbar.b .fill { background: linear-gradient(90deg, #1b4fa8, #58a0ff); }
.cbar.r .fill { background: linear-gradient(270deg, #a3221f, #ff7a73); margin-left: auto; }
.cbar.r .nm { flex-direction: row-reverse; }
.vs { font-family: var(--display); font-size: 18px; color: var(--gold); }
.controls { display: flex; gap: 6px; padding: 8px; }
.ibtn { cursor: pointer; width: 38px; height: 38px; border-radius: 11px; border: none; background: rgba(255,255,255,.08); color: var(--text); font-size: 16px; font-weight: 900; display: grid; place-items: center; transition: background .12s; }
.ibtn:hover { background: rgba(255,255,255,.16); }
.ibtn.sel { background: var(--gold); color: #1d1432; }
.rivalcard { display: flex; gap: 10px; align-items: center; padding: 8px 12px; }
.rivalcard .av { font-size: 30px; }
.rivalcard .nm { font-family: var(--display); font-size: 17px; }
.rivalcard .sm { font-size: 12px; color: var(--muted); font-weight: 800; }

/* dock */
.dock { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; max-width: calc(100vw - 480px); min-width: 520px; }
.tabs { display: flex; gap: 4px; padding: 5px; align-self: center; }
.tab { cursor: pointer; border: none; background: transparent; color: var(--muted); font-weight: 900; font-size: 13px; padding: 7px 12px; border-radius: 10px; display: flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--text); background: rgba(255,255,255,.07); }
.tab.sel { color: #1d1432; background: var(--gold); }
.items { display: flex; gap: 8px; padding: 8px; overflow-x: auto; scrollbar-width: thin; }
.item { cursor: pointer; flex: 0 0 auto; width: 84px; padding: 8px 6px 7px; border-radius: 13px; background: rgba(255,255,255,.06); border: 2px solid transparent; text-align: center; position: relative; transition: transform .08s, background .12s; }
.item:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); }
.item.sel { border-color: var(--gold); background: rgba(255,210,63,.13); }
.item.off { opacity: .45; }
.item .ic { font-size: 30px; line-height: 1.1; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
.item .nm { font-size: 11px; font-weight: 900; line-height: 1.15; margin-top: 3px; min-height: 26px; display: flex; align-items: center; justify-content: center; }
.item .cost { font-size: 12px; font-weight: 900; color: var(--green); }
.item .cost.no { color: #ff8a8a; }
.item .badge { position: absolute; top: 4px; right: 5px; font-size: 10px; font-weight: 900; color: var(--muted); }
.item .count { position: absolute; top: 3px; left: 6px; font-size: 11px; font-weight: 900; color: var(--gold); }

.readybox { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; padding: 10px; width: 220px; }
.stance { display: flex; gap: 6px; }
.stance button { flex: 1; cursor: pointer; border: 2px solid transparent; border-radius: 12px; padding: 8px 4px; background: rgba(255,255,255,.07); color: var(--text); font-weight: 900; font-size: 13px; }
.stance button.sel { border-color: var(--gold); background: rgba(255,210,63,.14); }
.readybox .btn.big { font-size: 24px; padding: 12px 10px; }
.readybtn { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 4px 0 #c78400, 0 0 0 0 rgba(255,210,63,.55); } 50% { box-shadow: 0 4px 0 #c78400, 0 0 0 12px rgba(255,210,63,0); } }
.supply { display: flex; justify-content: space-between; font-size: 12px; font-weight: 900; color: var(--muted); }
.supply .bar { flex: 1; margin-left: 8px; height: 8px; border-radius: 99px; background: rgba(0,0,0,.4); overflow: hidden; align-self: center; }
.supply .bar div { height: 100%; background: linear-gradient(90deg, var(--blue), #7fb3ff); }

/* side panels */
.feed { position: absolute; right: 124px; top: calc(156px + env(safe-area-inset-top, 0px)); width: 300px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.msg { pointer-events: none; padding: 9px 12px; border-radius: 14px; background: rgba(14,20,44,.86); border-left: 4px solid var(--gold); font-size: 13px; font-weight: 700; line-height: 1.35; box-shadow: var(--shadow); animation: slidein .35s cubic-bezier(.2,1.4,.4,1); }
.msg .who { font-weight: 900; font-size: 12px; margin-bottom: 2px; }
.msg.sys { border-left-color: #7fb3ff; }
.msg.bad { border-left-color: var(--red); }
.msg.good { border-left-color: var(--green); }
.msg.fade { opacity: 0; transform: translateX(20px); transition: all .6s; }
@keyframes slidein { from { opacity: 0; transform: translateX(40px) scale(.9); } to { opacity: 1; transform: none; } }
.info { position: absolute; left: 16px; top: calc(106px + env(safe-area-inset-top, 0px)); width: 250px; padding: 14px; max-height: calc(100vh - 120px); overflow: auto; }
.info h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .5px; }
.info .sub { font-size: 12px; color: var(--muted); font-weight: 800; margin-bottom: 8px; }
.meters { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 8px; align-items: center; font-size: 12px; font-weight: 900; }
.meter { height: 8px; border-radius: 99px; background: rgba(0,0,0,.4); overflow: hidden; }
.meter div { height: 100%; border-radius: 99px; }
.info .btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.info .btns .btn { padding: 7px 11px; font-size: 13px; }
.kv { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; padding: 2px 0; }
.kv span:first-child { color: var(--muted); }
.scout { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 210px; padding: 12px; }
.scout h5 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: .5px; }
.scout .army { display: flex; flex-wrap: wrap; gap: 5px; }
.scout .note { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 6px; line-height: 1.35; }

/* toasts + banners */
.banner { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.banner .t { font-family: var(--display); font-size: clamp(44px, 8vw, 96px); letter-spacing: 3px; color: #fff; -webkit-text-stroke: 3px #2a1745; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(42,23,69,.8), 0 16px 40px rgba(0,0,0,.6); animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
.banner .s { font-family: var(--display); font-size: clamp(16px, 2.4vw, 26px); letter-spacing: 2px; color: var(--gold); text-shadow: 0 3px 0 #2a1745; margin-top: 4px; }
.banner.out { opacity: 0; transition: opacity .5s; }
@keyframes pop { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.floater { position: absolute; font-weight: 900; font-size: 13px; color: var(--green); text-shadow: 0 2px 3px rgba(0,0,0,.7); pointer-events: none; white-space: nowrap; transform: translate(-50%, -50%); }
.thought { position: absolute; max-width: 170px; padding: 6px 9px; border-radius: 12px; background: rgba(255,255,255,.93); color: #26203a; font-size: 12px; font-weight: 800; line-height: 1.25; pointer-events: none; transform: translate(-50%, -100%); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.thought::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: rgba(255,255,255,.93); border-bottom: 0; }
.tooltip { position: absolute; z-index: 10; max-width: 290px; padding: 10px 12px; border-radius: 12px; background: rgba(10,14,34,.96); border: 1px solid var(--line); font-size: 13px; line-height: 1.4; pointer-events: none; box-shadow: var(--shadow); }
.tooltip b { font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: .4px; }
.tooltip .d { color: var(--muted); font-weight: 700; margin: 4px 0; }
.tooltip .g { display: grid; grid-template-columns: auto auto; gap: 1px 12px; font-weight: 800; font-size: 12px; }
.cursorhint { position: absolute; padding: 5px 9px; border-radius: 9px; background: rgba(10,14,34,.9); font-size: 12px; font-weight: 800; pointer-events: none; transform: translate(14px, 14px); white-space: nowrap; }
.cursorhint.bad { color: #ff9a9a; }
.minimap { position: absolute; right: 16px; top: calc(156px + env(safe-area-inset-top, 0px)); padding: 5px; opacity: .92; }
.minimap canvas { display: block; border-radius: 10px; cursor: pointer; }

/* coaster builder */
.cbuilder { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); width: min(640px, 92vw); padding: 14px 16px; }
.cbuilder h4 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 22px; }
.cbuilder .how { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.5; }
.cstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
.cstat { padding: 7px; border-radius: 10px; background: rgba(255,255,255,.06); text-align: center; }
.cstat .v { font-family: var(--display); font-size: 20px; }
.cstat .l { font-size: 10px; color: var(--muted); font-weight: 900; letter-spacing: .5px; text-transform: uppercase; }
.cwarn { color: #ff9a9a; font-weight: 900; font-size: 13px; min-height: 18px; }

/* results / game over */
.results { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, 94vw); padding: 26px; text-align: center; }
.results h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 64px; letter-spacing: 3px; }
.results .win { color: var(--gold); text-shadow: 0 5px 0 #7a4a00; }
.results .lose { color: #ff8a8a; text-shadow: 0 5px 0 #6b1614; }
.cmp { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 16px; margin: 18px 0; font-weight: 800; }
.cmp .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .8px; align-self: center; }
.cmp .a { text-align: right; color: #9cc3ff; }
.cmp .b { text-align: left; color: #ffb0a8; }
.spd { font-size: 12px; font-weight: 900; }
.pausebadge { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); padding: 6px 16px; border-radius: 999px; background: rgba(255,210,63,.95); color: #1d1432; font-weight: 900; letter-spacing: 1.5px; pointer-events: none; }
@media (max-width: 1100px) {
  .dock { min-width: 0; max-width: calc(100vw - 280px); left: 16px; transform: none; }
  .feed { width: 250px; }
  .scout, .minimap { display: none; }
}
@media (max-width: 760px) {
  .topbar { gap: 8px; }
  .stats { padding: 4px; }
  .stat { min-width: 0; padding: 2px 6px; }
  .stat .v { font-size: 17px; }
  .center { order: 3; flex: 1 1 100%; min-width: 0; padding: 6px 10px; }
  .phase .name, .phase .timer { font-size: 17px; }
  .rivalcard { display: none; }
  .controls { padding: 5px; gap: 4px; }
  .ibtn { width: 32px; height: 32px; font-size: 14px; }
  .feed { right: 16px; left: 16px; width: auto; top: calc(205px + env(safe-area-inset-top, 0px)); }
  .info { display: none; }
  .readybox { left: 16px; right: 16px; width: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .readybox .stance { flex: 1 1 60%; }
  .readybox .btn.big { flex: 1 1 100%; font-size: 20px; }
  .dock { left: 16px; right: 16px; max-width: none; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  .tabs { overflow-x: auto; max-width: 100%; align-self: stretch; }
  .tab { padding: 6px 8px; font-size: 12px; }
  .item { width: 74px; }
  .cbuilder { bottom: auto; top: calc(120px + env(safe-area-inset-top, 0px)); }
  .cstats { grid-template-columns: repeat(2, 1fr); }
  .modal { padding: 18px; }
}
</style>
